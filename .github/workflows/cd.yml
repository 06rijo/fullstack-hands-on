# CD — publish container images to GitHub Container Registry (GHCR).
#
# Builds each app's images and pushes them to ghcr.io/<owner>/fullstack-hands-on/<app>-{backend,frontend}
# so they can be pulled for deployment. Triggered manually (workflow_dispatch)
# or automatically when a tag matching v* is pushed.
#
# Requires:
#   - The repository to have "Write" or "Admin" on GitHub Actions so
#     `packages: write` can push images (checked out by default with the
#     GITHUB_TOKEN in this workflow).

name: CD

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to publish (directory under apps/). Leave blank for all apps."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  # --- Discover apps -------------------------------------------------------
  discover:
    name: Discover apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.dir_output }}
      app_input: ${{ steps.list.outputs.app_input }}
    steps:
      - uses: actions/checkout@v4

      - name: List apps under apps/
        id: list
        run: |
          APPS=$(for d in apps/*/; do [ -d "$d" ] && basename "$d"; done)
          INPUT="${{ github.event.inputs.app }}"
          if [ -n "$INPUT" ]; then
            APPS=$(echo "$APPS" | tr ' ' '\n' | grep -x "$INPUT" || true)
            [ -z "$APPS" ] && { echo "::error::Requested app '$INPUT' not found under apps/"; exit 1; }
          fi
          MATRIX=$(printf '%s\n' "$APPS" | jq -R -s -c 'split("\n") | map(select(length > 0)) | {app: .}')
          echo "Publishing apps: $(echo "$APPS" | tr '\n' ' ')"
          echo "dir_output=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "app_input=$INPUT" >> "$GITHUB_OUTPUT"

  # --- Build and push all images for an app --------------------------------
  publish:
    name: Publish ${{ matrix.app }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image prefix
        id: meta
        shell: bash
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REV="${{ github.ref_type == 'tag' && github.ref_name || github.sha }}"
          echo "prefix=ghcr.io/${OWNER}/fullstack-hands-on/${{ matrix.app }}" >> "$GITHUB_OUTPUT"
          echo "rev=${REV}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        working-directory: apps/${{ matrix.app }}
        run: |
          docker build -t "${{ steps.meta.outputs.prefix }}-backend:${{ steps.meta.outputs.rev }}" \
                       -t "${{ steps.meta.outputs.prefix }}-backend:latest" ./backend
          docker push --all-tags "${{ steps.meta.outputs.prefix }}-backend"

      - name: Build and push frontend image
        working-directory: apps/${{ matrix.app }}
        run: |
          docker build -t "${{ steps.meta.outputs.prefix }}-frontend:${{ steps.meta.outputs.rev }}" \
                       -t "${{ steps.meta.outputs.prefix }}-frontend:latest" ./frontend
          docker push --all-tags "${{ steps.meta.outputs.prefix }}-frontend"
